name: Individual planning integration

on:
  push:
    branches:
      - feature/individual-excel-import-export
      - feature/team-roles-approvals
  workflow_dispatch:

permissions:
  contents: read

jobs:
  individual-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web application
        run: pnpm build
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Run isolated SQLite / API / Excel integration tests
        run: node scripts/test-individual-integration.mjs
