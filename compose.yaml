services:
  resursplanering:
    build:
      context: .
    image: resursplanering:local
    container_name: resursplanering
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - resursplanering-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  resursplanering-data:
    name: resursplanering-data
